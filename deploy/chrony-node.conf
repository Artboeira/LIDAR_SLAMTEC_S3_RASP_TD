# Sincronização de relógio dos nós (§6 do guia).
#
# O header V2 carrega `time.time()` do Pi (float64). Sem NTP, o timestamp é
# incomparável entre nós e qualquer medição de latência no TD ou no
# test_udp_receiver.py mente. O server-a é o master.
#
# Instalação (acrescenta ao chrony.conf existente, não substitui):
#   sudo cp deploy/chrony-node.conf /etc/chrony/conf.d/lidarmapper.conf
#   sudo systemctl restart chrony
#   chronyc tracking          # "Leap status : Normal", offset em ms
#   chronyc sources -v        # o 10.10.0.10 deve aparecer com '^*'
#
# Se a instalação do chrony no Pi não tiver /etc/chrony/conf.d/, cole a linha
# abaixo no fim de /etc/chrony/chrony.conf.

server 10.10.0.10 iburst prefer
